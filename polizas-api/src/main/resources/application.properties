spring.application.name=polizas-api

spring.datasource.url=jdbc:h2:mem:polizasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ponytail: IPC rate hardcoded as a single config value since the test does not
# define one; make it a request parameter if the business needs per-renewal overrides
polizas.ipc-rate=0.05

polizas.api-key=123456

polizas.core-mock.base-url=http://localhost:${server.port:8080}
