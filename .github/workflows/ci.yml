name: CI

on:
  push:
  pull_request:

jobs:
  commit-lint:
    name: Commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message format
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit: $MSG"
          if ! echo "$MSG" | grep -qP '^:[a-z0-9_]+: \[(back|infra|test|doc)\] [A-Z]'; then
            echo "Invalid commit message format."
            echo "Expected: :[emoji]: [(back|infra|test|doc)] Capitalized message"
            echo "Example:  :sparkles: [back] Add policy renewal endpoint"
            exit 1
          fi

  lint:
    name: Code quality
    needs: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check code style
        run: make lint

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: make test
